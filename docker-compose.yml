
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ohev
      POSTGRES_PASSWORD: ohev
      POSTGRES_DB: ohev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohev"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      OHE_DB_CONFIG_HOST: postgres
      OHE_DB_CONFIG_PORT: 5432
      OHE_DB_CONFIG_DB_NAME: ohev
      OHE_DB_CONFIG_USERNAME: ohev
      OHE_DB_CONFIG_PASSWORD: ohev
      OHE_ENCRYPTION_KEY_ID: default
      OHE_ENCRYPTION_KEY_VALUE: dev-secret-at-least-32-bytes-long!!
      OHE_SANDBOX_PROVIDER: docker
      # Workspace bind-mount source and snapshot store must be shared between
      # the app container and the sandbox containers it creates.  Using the
      # same host path on both sides means the Docker daemon (on the host)
      # can resolve the bind-mount source the app specifies.
      OHE_SANDBOX_WORKSPACE_DIR: /var/lib/openhands/workspaces
      OHE_SANDBOX_SNAPSHOT_DIR: /var/lib/openhands/snapshots
    ports:
      - "8000:8000"
    volumes:
      # Docker-in-Docker: the app creates sandbox containers via the Docker API.
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared workspace + snapshot directories.  The same host paths are
      # bind-mounted into sandbox containers by DockerSandboxService.
      - /var/lib/openhands/workspaces:/var/lib/openhands/workspaces
      - /var/lib/openhands/snapshots:/var/lib/openhands/snapshots
    depends_on:
      postgres:
        condition: service_healthy

version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ohev
      POSTGRES_PASSWORD: ohev
      POSTGRES_DB: ohev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohev"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      OHEV_DATABASE_URL: postgresql+asyncpg://ohev:ohev@postgres:5432/ohev
      OHEV_SANDBOX_PROVIDER: docker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

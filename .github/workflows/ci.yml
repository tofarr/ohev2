name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Unit tests with coverage
        run: uv run pytest -q

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @informalsystems/quint
      - name: Typecheck all specs
        run: |
          for f in specs/*.qnt; do
            echo "::group::typecheck $f"
            quint typecheck "$f"
            echo "::endgroup::"
          done
      - name: Run Quint tests
        run: |
          quint test specs/sandbox.qnt --main=sandbox
          quint test specs/auth.qnt --main=auth
          quint test specs/rest.qnt --main=rest
          quint test specs/encryption.qnt --main=encryption
      - name: Check invariants
        run: |
          quint run specs/sandbox.qnt --main=sandbox --invariant=statesConsistent --max-steps=100
          quint run specs/auth.qnt --main=auth --invariant=sessionIdsUnique --max-steps=100
          quint run specs/encryption.qnt --main=encryption --invariant=encryptionKeyInDecryptionKeys --max-steps=100

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run playwright install --with-deps chromium
      - name: Start services
        run: docker compose up -d
      - name: Run Playwright e2e
        run: uv run pytest tests/e2e -q --no-cov
      - if: always()
        run: docker compose down

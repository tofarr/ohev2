name: Pylint

on:
  workflow_dispatch:

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - name: Run pylint with default rules
        run: uv run --with pylint pylint src/openhands/ev2

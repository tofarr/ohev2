[project]
name = "openhands-ev2"
version = "0.1.0"
description = "OpenHands Enterprise v2 — a greenfield reimagining of OpenHands Enterprise."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "OpenHands" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openhands-sdk>=0.1",
    "openhands-tools>=0.1",
    "passlib[bcrypt]>=1.7",
    "pyjwt>=2.8",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "anyio>=4.4",
    "openhands-agent-server>=1.43.1",
    "joserfc>=1.7.4",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-postgresql>=6.0",
    "pytest-xdist>=3.6",
    "pytest-testmon>=2.1",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "vulture>=2.10",
    "types-passlib",
    "playwright>=1.40",
    "respx>=0.21",
]
docker = [
    "docker>=7.1",
]
s3 = [
    "boto3>=1.34",
]
k8s = [
    "kubernetes>=29.0",
]
e2b = [
    "e2b>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openhands"]

[tool.pytest.ini_options]
minversion = "8.2"
testpaths = ["tests/unit"]
# Coverage and the 94% gate live in `make test` / CI, not the default loop,
# so a bare `pytest` stays fast for iteration. xdist parallelizes across
# cores; --dist=loadgroup honors @pytest.mark.xdist_group for tests that must
# share a process/DB.
addopts = "-ra --strict-markers -n auto --dist=loadgroup"
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
branch = false
core = "sysmon"
source = ["openhands.ev2"]
omit = [
    "tests/*",
    # Local-only dev convenience script; not shipped as production code.
    "*/scripts/reset_local_dev_db.py",
    "*/scripts/start_local_dev_sandbox.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.vulture]
min_confidence = 60
paths = ["src/openhands/ev2", "vulture_whitelist.py"]
# FastAPI route handlers — registered via decorators, never called by name.
ignore_decorators = [
    "@router.*",
    "@clients_router.*",
    "@members_router.*",
    "@overrides_router.*",
    "@user_overrides_router.*",
    "@app.*",
    # Pydantic v2 hooks + stdlib decorators vulture can't trace.
    "@asynccontextmanager",
    "@contextmanager",
    "@lru_cache",
    "@cached_property",
    "@model_validator",
    "@field_serializer",
    "@field_validator",
    "@validator",
    "@property",
    "@overload",
    "@abstractmethod",
]
# Framework boilerplate params/attrs vulture reports as unused.
ignore_names = [
    "model_config",
    "cls",
    "exc_type",
    "exc_value",
    "traceback",
    "dialect",
    "impl",
    "cache_ok",
    # Pydantic validator/serializer methods (invoked by name via decorators).
    "_strip_*",
    "_validate_*",
    "_resolve_child*",
    "_enforce_id_cap",
    # SQLAlchemy TypeDecorator hooks.
    "process_bind_param",
    "process_result_value",
    # search_filter.Condition enum members (compared via .value / query params).
    "CONTAINS",
    "EQ",
    "NE",
    "LT",
    "LTE",
    "GT",
    "GTE",
    # Pydantic search-filter fields generated dynamically per attribute.
    "*__contains",
    "*__eq",
    "*__gte",
    "*__lt",
    "*__gt",
    "*__lte",
    # Optional/forward-compat config knobs.
    "role_field",
    "refresh_path",
    "max_ciphertext_length",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF"]
ignore = ["E501"]

# Vulture whitelist uses bare names as identifiers; ruff flags them as
# useless/undefined expressions. They are intentional (parsed by vulture).
[tool.ruff.lint.per-file-ignores]
"vulture_whitelist.py" = ["B018", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["openhands.ev2"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["openhands.ev2"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "psycopg-binary>=3.3.4",
    "pylint>=4.0.8",
    "testing-postgresql>=1.3.0",
]

[tool.pylint]
load-plugins = ["pylint.extensions.mccabe"]
[tool.pylint."messages control"]
disable = ["all"]
enable = ["too-complex"]
[tool.pylint.design]
max-complexity = 5

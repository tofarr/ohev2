[project]
name = "openhands-ev2"
version = "0.1.0"
description = "OpenHands Enterprise v2 — a greenfield reimagining of OpenHands Enterprise."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "OpenHands" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openhands-sdk>=0.1",
    "openhands-tools>=0.1",
    "passlib[bcrypt]>=1.7",
    "pyjwt>=2.8",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "anyio>=4.4",
    "openhands-agent-server>=1.43.1",
    "joserfc>=1.7.4",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-postgresql>=6.0",
    "pytest-xdist>=3.6",
    "pytest-testmon>=2.1",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-passlib",
    "playwright>=1.40",
    "respx>=0.21",
]
docker = [
    "docker>=7.1",
]
k8s = [
    "kubernetes>=29.0",
]
e2b = [
    "e2b>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openhands"]

[tool.pytest.ini_options]
minversion = "8.2"
testpaths = ["tests/unit"]
# Coverage and the 94% gate live in `make test` / CI, not the default loop,
# so a bare `pytest` stays fast for iteration. xdist parallelizes across
# cores; --dist=loadgroup honors @pytest.mark.xdist_group for tests that must
# share a process/DB.
addopts = "-ra --strict-markers -n auto --dist=loadgroup"
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
branch = false
core = "sysmon"
source = ["openhands.ev2"]
omit = [
    "tests/*",
    # Local-only dev convenience script; not shipped as production code.
    "*/scripts/reset_local_dev_db.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["openhands.ev2"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["openhands.ev2"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "psycopg-binary>=3.3.4",
    "pylint>=4.0.8",
    "testing-postgresql>=1.3.0",
]

[tool.pylint]
load-plugins = ["pylint.extensions.mccabe"]
[tool.pylint."messages control"]
disable = ["all"]
enable = ["too-complex"]
[tool.pylint.design]
max-complexity = 5
